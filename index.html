<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speicherpunkt</title>
<meta name="description" content="Setz einen Speicherpunkt, bevor du aufhörst. Wenn du zurückkommst, zeigt dir Speicherpunkt, wo du warst, und genau einen nächsten Schritt.">
<meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speicherpunkt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/lora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Lora"; src: url("fonts/lora.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Lora"; src: url("fonts/lora-italic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/inter-600.woff2") format("woff2"); font-weight: 600 700; font-style: normal; font-display: swap; }

/* Layout: wie der Papier-Planer – warmes Papier, weisse Karten, eine Farbe pro Bereich, Lora mit farbigen Kursivwörtern. */
:root {
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light;
  --paper: #f7f2ea; --card: #fffdf9; --sunk: #f1ebe1; --line: #e9e0d2; --ink: #2b2830; --muted: #716b74; --faint: #a59d97;
  --terra: #c46d49; --mustard: #e4b860; --coral: #e3916f; --lavender: #a497d6; --sage: #93b29f; --teal: #6fa39b; --sky: #8bb1d1; --rose: #e3a0b1; --taupe: #b9ad9e;
  --mustard-ink: #9a7320; --sage-ink: #4f7a66; --lav-ink: #6a5aa8; --rose-ink: #b0607a; --sky-ink: #48759b;
  --cta: #2b2830; --on-cta: #fdfaf5;
  --blob-a: .9;
  --font-serif: "Lora", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1c1a20; --card: #25222a; --sunk: #2c2932; --line: #39343f; --ink: #f0eae2; --muted: #aaa2a9; --faint: #7f7880;
  --terra: #e79a77; --mustard: #e9c374; --coral: #e79d7e; --lavender: #b3a7e2; --sage: #9fbfab; --teal: #84b5ad; --sky: #9bbfdc; --rose: #e9aebd; --taupe: #9e9385;
  --mustard-ink: #ecc77a; --sage-ink: #a7c9b5; --lav-ink: #c2b7ee; --rose-ink: #efb4c3; --sky-ink: #a9c9e6;
  --cta: #f0eae2; --on-cta: #1c1a20; --blob-a: .42; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1c1a20; --card: #25222a; --sunk: #2c2932; --line: #39343f; --ink: #f0eae2; --muted: #aaa2a9; --faint: #7f7880;
  --terra: #e79a77; --mustard: #e9c374; --coral: #e79d7e; --lavender: #b3a7e2; --sage: #9fbfab; --teal: #84b5ad; --sky: #9bbfdc; --rose: #e9aebd; --taupe: #9e9385;
  --mustard-ink: #ecc77a; --sage-ink: #a7c9b5; --lav-ink: #c2b7ee; --rose-ink: #efb4c3; --sky-ink: #a9c9e6;
  --cta: #f0eae2; --on-cta: #1c1a20; --blob-a: .42; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
[hidden] { display: none !important; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--font-serif); font-weight: 400; letter-spacing: -.01em; text-wrap: balance; }
em { font-style: italic; color: var(--accent, var(--terra)); }

.app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 22px 72px; display: flex; flex-direction: column; gap: 22px; }

/* Bereichsfarben wie die Reiter im Planer */
[data-view="home"] { --accent: var(--terra); --dot: var(--coral); }
[data-view="project"] { --accent: var(--sage-ink); --dot: var(--sage); }
[data-view="focus"] { --accent: var(--mustard-ink); --dot: var(--mustard); }
[data-view="save"] { --accent: var(--lav-ink); --dot: var(--lavender); }
[data-view="finished"] { --accent: var(--mustard-ink); --dot: var(--mustard); }
[data-view="settings"] { --accent: var(--sky-ink); --dot: var(--sky); }

/* dekorative Kreise (Titelseite) */
body { position: relative; }
.blobs { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blobs span { position: absolute; border-radius: 50%; opacity: var(--blob-a); }
.blobs .b1 { width: 300px; height: 300px; right: -110px; top: -120px; background: var(--mustard); }
.blobs .b2 { width: 110px; height: 110px; right: 150px; top: 96px; background: var(--coral); opacity: calc(var(--blob-a) * .85); }
.blobs .b3 { width: 70px; height: 70px; right: -14px; top: 210px; background: var(--lavender); }
.blobs .b4 { width: 200px; height: 200px; left: -110px; bottom: -120px; background: var(--sage); }
.blobs .b5 { width: 90px; height: 90px; left: 50px; bottom: -55px; background: var(--sky); }
.blobs .b6 { width: 34px; height: 34px; right: 34px; bottom: 34px; background: var(--rose); }
body:not([data-view="home"]):not([data-view="finished"]) .blobs { display: none; }
@media (max-width: 520px) { .blobs .b1 { width: 190px; height: 190px; right: -95px; top: -95px; } .blobs .b2 { width: 64px; height: 64px; right: 66px; top: 74px; } .blobs .b3 { right: -18px; top: 120px; width: 44px; height: 44px; } }

/* Kopfzeile: farbiger Punkt + Label links, Pillen-Button rechts */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.eyebrow { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-sans); font-weight: 600; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--taupe)); flex: none; }
.eyebrow.plain::before { display: none; }
header.top > .eyebrow { min-width: 0; overflow-wrap: anywhere; line-height: 1.4; letter-spacing: .14em; }
header.top > .row { flex: none; flex-wrap: nowrap; gap: 6px; }
.huge, .big-step, .title { overflow-wrap: anywhere; }
.label { font-family: var(--font-sans); font-weight: 600; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

button { font: inherit; cursor: pointer; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 11px 20px; min-height: 46px; font-size: .95rem; font-weight: 500; transition: border-color .15s, background-color .15s, transform .1s; }
button:hover { border-color: var(--faint); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--cta); color: var(--on-cta); border-color: var(--cta); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
button.primary:hover { border-color: var(--cta); opacity: .92; }
button.pill { min-height: 34px; padding: 6px 14px; font-size: .68rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); background: var(--card); }
button.add { width: 100%; background: transparent; border-style: dashed; color: var(--muted); }
button.wide { width: 100%; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.arrow { font-size: 1.05em; line-height: 1; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.stack { flex-direction: column; align-items: stretch; }
.row.stack > button { width: 100%; }

/* Titel mit farbigem Kursivwort */
.title { font-size: clamp(2.3rem, 10vw, 3.2rem); line-height: 1.05; }
.title.md { font-size: clamp(1.9rem, 8vw, 2.5rem); }
.title.center { text-align: center; }
.sub { color: var(--muted); font-size: .98rem; max-width: 46ch; }
.wave { display: block; width: 92px; height: 22px; color: var(--faint); }
.intro { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow-wrap: anywhere; }
.card.tint { border-color: transparent; background: color-mix(in srgb, var(--tint, var(--sage)) 18%, var(--card)); }
.hero .proj-name { font-family: var(--font-serif); font-size: 1.05rem; color: var(--muted); }
.big-step { font-family: var(--font-serif); font-size: clamp(1.6rem, 7vw, 2.05rem); line-height: 1.18; }
.small { font-size: .78rem; color: var(--faint); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-static { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: .74rem; color: var(--muted); }
.chip { min-height: 38px; padding: 7px 15px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--lavender) 22%, var(--card)); border-color: var(--lavender); color: var(--lav-ink); font-weight: 600; }

.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 16px; font-size: .9rem; color: var(--muted); }
.tag { font-size: .64rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; background: color-mix(in srgb, var(--mustard) 30%, var(--card)); color: var(--ink); white-space: nowrap; }

/* Projektliste wie „Wohin heute?“ */
.group { display: flex; flex-direction: column; gap: 10px; }
.group > .label, .group > summary { padding: 0 4px; }
details.group > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after, details.history > summary::after { content: "›"; font-size: 1rem; letter-spacing: 0; transition: transform .15s; }
details[open] > summary::after { transform: rotate(90deg); }
.list { display: flex; flex-direction: column; gap: 10px; }
.proj { --pc: var(--sage); text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; width: 100%; padding: 14px 16px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); min-width: 0; }
.num { width: 40px; height: 40px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-family: var(--font-serif); font-size: 1.05rem; flex: none; }
.proj .body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.proj .name { font-family: var(--font-serif); font-size: 1.1rem; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.proj .step { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .go { color: var(--faint); font-size: 1.15rem; }
.proj.resting { background: transparent; }
.proj.resting .num { background: transparent; border: 1.5px solid var(--pc); color: var(--pc); }
.proj.finished .num { background: transparent; border: 1.5px solid var(--pc); color: var(--pc); }
.c0 { --pc: var(--sage); } .c1 { --pc: var(--coral); } .c2 { --pc: var(--lavender); } .c3 { --pc: var(--mustard); } .c4 { --pc: var(--sky); } .c5 { --pc: var(--rose); } .c6 { --pc: var(--teal); }

.quote { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 18px 6px 4px; }
.quote .mark { font-family: var(--font-serif); font-size: 2.4rem; line-height: .6; color: var(--mustard); }
.quote p { font-family: var(--font-serif); font-style: italic; font-size: 1.15rem; line-height: 1.45; max-width: 30ch; }

/* Projektansicht */
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow-wrap: anywhere; }
.where { font-family: var(--font-serif); font-size: 1.08rem; line-height: 1.5; white-space: pre-wrap; padding-left: 16px; border-left: 2px solid var(--line); }
.welcome { --tint: var(--rose); }
.welcome .wt { font-family: var(--font-serif); font-size: 1.35rem; line-height: 1.2; }
.welcome .wt em { color: var(--rose-ink); }
.stepcard { --tint: var(--sage); }

details.history > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 4px; }
details.history > summary::-webkit-details-marker { display: none; }
.timeline { list-style: none; margin: 12px 0 0; padding: 0 0 0 8px; display: flex; flex-direction: column; }
.timeline li { position: relative; padding: 0 0 18px 24px; border-left: 1.5px dotted var(--line); display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li .dotm { position: absolute; left: -6px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--sage); }
.timeline li .dotm.open { background: var(--card); border: 1.5px solid var(--taupe); }
.timeline .was { font-family: var(--font-serif); font-size: 1rem; white-space: pre-wrap; }
.timeline .then { font-size: .9rem; color: var(--muted); }

/* Fokus */
.focus { min-height: 58vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; min-width: 0; overflow-wrap: anywhere; }
.focus .huge { font-family: var(--font-serif); font-size: clamp(2.1rem, 9.5vw, 3rem); line-height: 1.1; max-width: 16ch; }
.ring { width: 64px; height: 64px; border-radius: 50%; background: color-mix(in srgb, var(--mustard) 35%, var(--card)); display: grid; place-items: center; }
.ring::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); }
@media (prefers-reduced-motion: no-preference) { .ring { animation: breathe 4s ease-in-out infinite; } @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } } }

/* Formulare */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; overflow-wrap: anywhere; }
.panel h2 { font-size: 1.35rem; }
.panel.confirm { border-color: var(--coral); }
.field { display: flex; flex-direction: column; gap: 7px; }
label, .flabel { font-weight: 600; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
input[type=text], textarea { width: 100%; font: inherit; font-size: 1.02rem; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
input[type=text]::placeholder, textarea::placeholder { color: var(--faint); }
input[aria-invalid="true"] { border-color: var(--coral); }
textarea { min-height: 100px; resize: vertical; font-family: var(--font-serif); }
.hint { color: var(--muted); font-size: .84rem; }
.error { color: var(--terra); font-size: .9rem; }
.finish-offer { --tint: var(--mustard); }
.finish-offer .ft { font-family: var(--font-serif); font-size: 1.25rem; }
button.finish-btn { align-self: flex-start; background: var(--mustard); border-color: var(--mustard); color: #2b2205; font-weight: 600; }
.done-stage { min-height: 48vh; }
.settings-list { display: flex; flex-direction: column; gap: 14px; }
.settings-list .panel { gap: 12px; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: start; }
.howto .num { width: 30px; height: 30px; font-size: .9rem; }

.toast { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 36px); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--cta); color: var(--on-cta); padding: 11px 18px; border-radius: 999px; font-size: .9rem; pointer-events: none; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .app > * { animation: rise .3s ease-out both; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
</style>
</head>
<body>
<noscript><p style="padding:16px">Speicherpunkt braucht JavaScript.</p></noscript>
<div class="blobs" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span><span class="b6"></span></div>
<main class="app" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  const KEY = "speicherpunkt.v1";
  const DAY = 86400000;
  const $app = document.getElementById("app");
  const $toast = document.getElementById("toast");

  // ---------- state ----------
  let state = { v: 1, projects: [], updated: 0 };
  let examples = makeExamples();
  let view = { name: "home" };
  let storage = "memory"; // memory | local
  let confirmFor = null;

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function now() { return Date.now(); }

  function makeExamples() {
    const t = now();
    return [
      { id: "ex1", example: true, name: "Gartenhaus streichen", created: t - 30 * DAY, paused: false, remindAt: t - 1000,
        saves: [
          { id: "e1a", at: t - 20 * DAY, where: "Farbe gekauft, Pinsel liegen in der Garage.", next: "Abdeckplane auslegen", done: true },
          { id: "e1b", at: t - 12 * DAY, where: "Die Südwand ist fertig grundiert. Bei der Tür fehlt noch Klebeband.", next: "Klebeband um den Türrahmen kleben" } ] },
      { id: "ex2", example: true, name: "Bewerbungsunterlagen", created: t - 9 * DAY, paused: false, remindAt: null,
        saves: [ { id: "e2a", at: t - 2 * DAY, where: "Lebenslauf aktualisiert bis 2024. Letzte Stelle fehlt noch.", next: "Letzte Stelle mit drei Stichworten eintragen" } ] },
      { id: "ex3", example: true, name: "Gitarre üben", created: t - 90 * DAY, paused: true, remindAt: null,
        saves: [ { id: "e3a", at: t - 47 * DAY, where: "Barré-Griff F klappt fast, Saite H schnarrt noch.", next: "Gitarre stimmen und F fünfmal greifen" } ] }
    ];
  }

  function projects() { return state.projects.length ? state.projects : examples; }
  function showingExamples() { return state.projects.length === 0; }
  function find(id) { return projects().find(p => p.id === id); }
  function current(p) { return p.saves[p.saves.length - 1]; }
  function lastTouched(p) { const c = current(p); return c ? c.at : p.created; }
  function isDue(p) { return !p.paused && !p.finished && p.remindAt && p.remindAt <= now(); }
  const fmtDay = new Intl.DateTimeFormat("de-CH", { day: "numeric", month: "long", year: "numeric" });

  // ---------- persistence ----------
  function readLocal() {
    try { const raw = localStorage.getItem(KEY); if (!raw) return null; const s = JSON.parse(raw); return valid(s) ? s : null; } catch { return null; }
  }
  function writeLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); if (storage === "memory") storage = "local"; return true; } catch { return false; }
  }
  function valid(s) { return s && typeof s === "object" && Array.isArray(s.projects); }

  function persist() {
    state.updated = now();
    writeLocal();
  }

  // ---------- helpers ----------
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function ago(ts) {
    const d = now() - ts;
    const min = Math.round(d / 60000);
    if (min < 1) return "gerade eben";
    if (min < 60) return "vor " + min + (min === 1 ? " Minute" : " Minuten");
    const h = Math.round(min / 60);
    const days = Math.floor((startOfDay(now()) - startOfDay(ts)) / DAY);
    if (days === 0) return "heute";
    if (days === 1) return "gestern";
    if (days < 14) return "vor " + days + " Tagen";
    const w = Math.round(days / 7);
    if (days < 60) return "vor " + w + " Wochen";
    const m = Math.round(days / 30);
    if (days < 365) return "vor " + m + " Monaten";
    const y = Math.round(days / 365);
    return "vor " + y + (y === 1 ? " Jahr" : " Jahren");
  }
  function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  const fmtDate = new Intl.DateTimeFormat("de-CH", { weekday: "short", day: "numeric", month: "short" });
  const fmtTime = new Intl.DateTimeFormat("de-CH", { hour: "2-digit", minute: "2-digit" });
  function stamp(ts) { return fmtDate.format(ts) + " · " + fmtTime.format(ts); }
  function remindLabel(ts) {
    const days = Math.round((startOfDay(ts) - startOfDay(now())) / DAY);
    if (days <= 0) return "heute";
    if (days === 1) return "morgen";
    return "am " + fmtDate.format(ts);
  }
  function toast(msg) {
    $toast.textContent = msg; $toast.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { $toast.hidden = true; }, 3200);
  }
  function suggestion() {
    const act = projects().filter(p => !p.paused && !p.finished);
    if (!act.length) return null;
    const due = act.filter(isDue).sort((a, b) => a.remindAt - b.remindAt);
    if (due.length) return due[0];
    return act.slice().sort((a, b) => lastTouched(b) - lastTouched(a))[0];
  }
  const REMIND = [
    { k: "none", label: "Nicht erinnern" },
    { k: "1", label: "Morgen" },
    { k: "3", label: "In 3 Tagen" },
    { k: "7", label: "In einer Woche" }
  ];
  function remindFrom(k) {
    if (k === "none" || !k) return null;
    const d = startOfDay(now()) + Number(k) * DAY + 8 * 3600000;
    return d;
  }

  // ---------- views ----------
  function render() {
    const fn = VIEWS[view.name] || VIEWS.home;
    $app.innerHTML = fn();
    const p = view.id ? find(view.id) : null;
    document.body.dataset.view = view.name === "project" && p && p.finished ? "finished" : (VIEWS[view.name] ? view.name : "home");
    const f = $app.querySelector("[data-autofocus]");
    if (f) f.focus({ preventScroll: false });
  }

  const ARROW = `<span class="arrow" aria-hidden="true">→</span>`;
  const BACK = label => `<span aria-hidden="true">←</span> ${label}`;
  const WAVE = `<svg class="wave" viewBox="0 0 92 22" aria-hidden="true"><path d="M2 15c11-14 22-14 30 0s21 14 30 0 20-14 28 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  function colorOf(p) { let h = 0; for (const ch of String(p.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return "c" + (h % 7); }
  function initial(p) { const m = String(p.name).trim().match(/[\p{L}\p{N}]/u); return m ? m[0].toUpperCase() : "·"; }
  function mins(since) { const m = Math.max(0, Math.floor((now() - since) / 60000)); return m < 1 ? "Gerade angefangen" : "Seit " + m + (m === 1 ? " Minute" : " Minuten") + " dabei"; }

  const VIEWS = {
    home() {
      const list = projects();
      const s = suggestion();
      const due = list.filter(isDue).filter(p => p !== s);
      const active = list.filter(p => !p.paused && !p.finished && p !== s).sort((a, b) => lastTouched(b) - lastTouched(a));
      const resting = list.filter(p => p.paused && !p.finished).sort((a, b) => lastTouched(b) - lastTouched(a));
      const finished = list.filter(p => p.finished).sort((a, b) => b.finished - a.finished);
      let h = `<header class="top"><span class="eyebrow">Speicherpunkt</span><button class="pill" data-action="settings">Einstellungen</button></header>
      <section class="intro">${WAVE}<h1 class="title">Ein Schritt <em>nach dem</em> anderen.</h1>
        <p class="sub">Setz einen Speicherpunkt, bevor du aufhörst. Wenn du zurückkommst, wartet genau ein nächster Schritt auf dich.</p></section>`;
      if (showingExamples()) h += `<p class="banner" id="examples-note"><span class="tag">Beispiel</span><span>So sieht es aus, wenn du ein paar Projekte hast. Sobald du dein erstes eigenes anlegst, verschwinden die Beispiele.</span></p>`;
      if (s) {
        const c = current(s);
        h += `<section class="card hero" aria-labelledby="sug-h">
          <h2 id="sug-h" class="eyebrow" style="--dot: var(${isDue(s) ? "--mustard" : "--coral"})">${isDue(s) ? "Sanfte Erinnerung" : "Hier könntest du weitermachen"}</h2>
          <div><p class="proj-name">${esc(s.name)}</p><p class="small">Gespeichert ${esc(ago(lastTouched(s)))} · Speicherpunkt ${s.saves.length}</p></div>
          <p class="big-step">${esc(c ? c.next : "Ersten Schritt festlegen")}</p>
          <div class="row"><button class="primary" data-action="open" data-id="${esc(s.id)}">Weitermachen ${ARROW}</button>
          ${isDue(s) ? `<button data-action="snooze" data-id="${esc(s.id)}">Morgen wieder</button>` : ""}</div>
        </section>`;
      } else if (list.length && finished.length === list.length) {
        h += `<section class="card hero"><h2 class="eyebrow" style="--dot: var(--mustard)">Alles abgeschlossen</h2><p class="big-step">Starke Leistung. Leg ein neues Projekt an, wenn dir <em>danach</em> ist.</p></section>`;
      } else if (!list.length) {
        h += `<section class="card hero"><h2 class="eyebrow">Noch leer</h2><p class="big-step">Leg ein Projekt an und setz deinen <em>ersten</em> Speicherpunkt.</p></section>`;
      } else {
        h += `<section class="card hero"><h2 class="eyebrow" style="--dot: var(--rose)">Alles ruht gerade</h2><p class="big-step">Das ist in Ordnung. Wenn du so weit bist, weck ein Projekt <em>auf.</em></p></section>`;
      }
      h += `<button class="add" data-action="new">+ Neues Projekt</button>`;
      const others = due.concat(active.filter(p => !due.includes(p)));
      if (others.length) h += `<section class="group" aria-labelledby="all-h"><h2 id="all-h" class="label">Weitere Projekte</h2><div class="list">${others.map(projRow).join("")}</div></section>`;
      if (resting.length) h += `<details class="group"${others.length || !s ? " open" : ""}><summary class="label">Ruhen gerade (${resting.length})</summary><div class="list">${resting.map(projRow).join("")}</div></details>`;
      if (finished.length) h += `<details class="group" id="finished-group"><summary class="label">Abgeschlossen (${finished.length})</summary><div class="list">${finished.map(projRow).join("")}</div></details>`;
      h += `<section class="quote"><span class="mark" aria-hidden="true">“</span><p>Du musst nicht alles auf einmal schaffen. Ein Schritt zählt.</p><span class="label">Weniger ist mehr</span></section>`;
      return h;
    },

    project() {
      const p = find(view.id); if (!p) { view = { name: "home" }; return VIEWS.home(); }
      if (p.finished) return VIEWS.finished();
      const c = current(p);
      const past = p.saves.slice(0, -1).reverse();
      let h = `<header class="top"><span class="eyebrow" style="--dot: var(${"--" + ({c0:"sage",c1:"coral",c2:"lavender",c3:"mustard",c4:"sky",c5:"rose",c6:"teal"})[colorOf(p)]})">${esc(p.name)}${p.example ? " · Beispiel" : ""}${p.paused ? " · ruht" : ""}</span>
        <div class="row"><button class="pill" data-action="menu" data-id="${esc(p.id)}" aria-expanded="${view.menu ? "true" : "false"}">Mehr</button><button class="pill" data-action="home">${BACK("Übersicht")}</button></div></header>`;
      h += `<section class="stage" aria-labelledby="p-h">
        <h2 id="p-h" class="title md">Hier warst du <em>stehen geblieben.</em></h2>
        ${c && !p.paused && now() - c.at > 7 * DAY ? `<div class="card tint welcome" id="welcome"><p class="wt">Du bist nicht <em>hinterher.</em></p><p>Schön, dass du wieder da bist. Du musst nichts aufholen, nur diesen einen Schritt.</p>
          <div class="chips"><span class="chip-static">Kein Aufholen</span><span class="chip-static">Lücken sind normal</span><span class="chip-static">Ein Schritt reicht</span></div></div>` : ""}
        ${c ? `${c.where ? `<p class="where">${esc(c.where)}</p>` : ""}
        <div class="card tint stepcard">
          <span class="label">Dein nächster Mini-Schritt</span>
          <p class="big-step" id="next-step">${esc(c.next)}</p>
          <p class="small">Speicherpunkt ${p.saves.length} · ${esc(stamp(c.at))} · ${esc(ago(c.at))}${p.remindAt && !p.paused ? ` · Erinnerung ${esc(remindLabel(p.remindAt))}` : ""}</p>
        </div>` : `<p>Noch kein Speicherpunkt.</p>`}
      </section>`;
      if (view.edit && c) {
        h += `<form class="panel" data-form="edit-step">
          <div class="field"><label for="f-step">Schritt kleiner machen</label>
          <input type="text" id="f-step" name="next" value="${esc(c.next)}" maxlength="200" required data-autofocus>
          <div class="hint">So klein, dass er fast lächerlich ist. Zum Beispiel nur die Datei öffnen.</div></div>
          <div class="row"><button class="primary" type="submit">Übernehmen</button><button type="button" data-action="cancel-edit">Abbrechen</button></div>
        </form>`;
      } else if (p.paused) {
        h += `<div class="row stack"><button class="primary" data-action="resume" data-id="${esc(p.id)}">Aufwecken ${ARROW}</button></div>`;
      } else {
        h += `<div class="row stack">
          <button class="primary" data-action="start" data-id="${esc(p.id)}" ${c ? "" : "disabled"}>Ich fange an ${ARROW}</button>
          <div class="row"><button data-action="edit" ${c ? "" : "disabled"}>Schritt kleiner machen</button>
          <button data-action="save" data-id="${esc(p.id)}">Neuer Speicherpunkt</button></div></div>`;
      }
      if (view.menu) h += menuHtml(p);
      if (past.length) {
        h += `<details class="history"><summary class="label">Frühere Speicherpunkte (${past.length})</summary><ol class="timeline" reversed>${past.map(sv => `<li>
          <span class="dotm${sv.done ? "" : " open"}" aria-hidden="true"></span>
          <span class="small">${esc(stamp(sv.at))}${sv.done ? " · erledigt" : ""}</span>
          ${sv.where ? `<p class="was">${esc(sv.where)}</p>` : ""}
          ${sv.final ? "" : `<p class="then">Nächster Schritt: ${sv.done ? `<s>${esc(sv.next)}</s>` : esc(sv.next)}</p>`}</li>`).join("")}</ol></details>`;
      }
      return h;
    },

    finished() {
      const p = find(view.id); if (!p) { view = { name: "home" }; return VIEWS.home(); }
      const c = current(p);
      const days = Math.max(1, Math.round((startOfDay(p.finished) - startOfDay(p.created)) / DAY) + 1);
      let h = `<header class="top"><span class="eyebrow">Fertig</span><div class="row"><button class="pill" data-action="menu" data-id="${esc(p.id)}" aria-expanded="${view.menu ? "true" : "false"}">Mehr</button><button class="pill" data-action="home">${BACK("Übersicht")}</button></div></header>
      <section class="focus done-stage" aria-labelledby="fin-h">
        <div class="ring" aria-hidden="true"></div>
        <h2 id="fin-h" class="label">Abgeschlossen · ${esc(fmtDay.format(p.finished))}</h2>
        <p class="huge">${esc(p.name)}</p>
        <p class="title md center">Gut <em>gemacht.</em></p>
        <p class="small" id="fin-stats">${p.saves.length} ${p.saves.length === 1 ? "Speicherpunkt" : "Speicherpunkte"} · ${days} ${days === 1 ? "Tag" : "Tage"} vom Start bis zum Ziel</p>
        ${c && c.where ? `<p class="where" style="text-align:left">${esc(c.where)}</p>` : ""}
      </section>
      <div class="row stack"><button class="primary" data-action="home">Zur Übersicht</button>
      <button data-action="reopen" data-id="${esc(p.id)}">Wieder öffnen</button></div>`;
      if (view.menu) h += menuHtml(p);
      return h;
    },

    focus() {
      const p = find(view.id); if (!p) { view = { name: "home" }; return VIEWS.home(); }
      const c = current(p);
      return `<header class="top"><span class="eyebrow">${esc(p.name)}</span><button class="pill" data-action="open" data-id="${esc(p.id)}">${BACK("Zurück")}</button></header>
      <section class="focus" aria-labelledby="f-h">
        <div class="ring" aria-hidden="true"></div>
        <h2 id="f-h" class="title md center">Nur <em>das hier.</em></h2>
        <p class="huge">${esc(c.next)}</p>
        <p class="small" id="since">${mins(view.since)}</p>
      </section>
      <div class="row stack"><button class="primary" data-action="done" data-id="${esc(p.id)}">Geschafft ${ARROW}</button>
      <button data-action="save" data-id="${esc(p.id)}">Unterbrechen und speichern</button></div>`;
    },

    save() {
      const isNew = view.isNew;
      const p = isNew ? null : find(view.id);
      if (!isNew && !p) { view = { name: "home" }; return VIEWS.home(); }
      const draft = view.draft || {};
      const rk = draft.remind || "none";
      const head = isNew ? `Neues <em>Projekt.</em>` : view.reopen ? `Wieder öffnen: Wie geht es <em>weiter?</em>` : view.afterDone ? `Geschafft. Was kommt als <em>Nächstes?</em>` : `Speicherpunkt <em>setzen.</em>`;
      return `<header class="top"><span class="eyebrow">${p ? esc(p.name) : "Neues Projekt"}</span><button class="pill" data-action="${isNew ? "home" : "open"}" ${p ? `data-id="${esc(p.id)}"` : ""}>${BACK("Abbrechen")}</button></header>
      <h2 class="title md">${head}</h2>
      <form class="panel" data-form="save" novalidate>
        ${view.afterDone ? `<div class="card tint finish-offer"><p class="ft">War das der <em>letzte</em> Schritt?</p>
          <button type="button" class="finish-btn" data-action="finish" data-id="${esc(p.id)}">Projekt abschliessen</button>
          <p class="hint">Optional kannst du unten notieren, wie es ausgegangen ist. Sonst halte fest, wie es weitergeht.</p></div>` : ""}
        ${isNew ? `<div class="field"><label for="f-name">Wie heisst das Projekt?</label>
          <input type="text" id="f-name" name="name" maxlength="80" value="${esc(draft.name || "")}" data-autofocus placeholder="z. B. Steuererklärung"></div>` : ""}
        <div class="field"><label for="f-where">Wo stehst du gerade?</label>
          <textarea id="f-where" name="where" maxlength="1000" placeholder="Ein, zwei Sätze für dein zukünftiges Ich." ${isNew ? "" : "data-autofocus"}>${esc(draft.where || "")}</textarea>
          <div class="hint">Optional. Auf dem Handy kannst du mit dem Mikrofon der Tastatur diktieren.</div></div>
        <div class="field"><label for="f-next">Nächster Mini-Schritt</label>
          <input type="text" id="f-next" name="next" maxlength="200" value="${esc(draft.next || "")}" placeholder="So klein, dass er fast lächerlich ist">
          <div class="error" id="err" ${view.err ? "" : "hidden"}>${esc(view.err || "")}</div></div>
        <div class="field"><span class="flabel" id="r-l">Erinnern</span>
          <div class="chips" role="group" aria-labelledby="r-l">${REMIND.map(r => `<button type="button" class="chip" data-action="remind" data-k="${r.k}" aria-pressed="${rk === r.k}">${r.label}</button>`).join("")}</div>
          <div class="hint">Die Erinnerung erscheint hier in der App, sobald du sie öffnest.</div></div>
        <button class="primary wide" type="submit">Speichern ${ARROW}</button>
      </form>`;
    },

    settings() {
      const where = storage === "local" ? "nur auf diesem Gerät, in diesem Browser. Niemand sonst sieht sie, auch kein Server. Zwischen Handy und PC wird noch nichts abgeglichen. Mach ab und zu eine Sicherung." : "nur vorübergehend. Dieser Browser erlaubt kein Speichern (zum Beispiel im privaten Modus), mach deshalb eine Sicherung.";
      return `<header class="top"><span class="eyebrow">Einstellungen</span><button class="pill" data-action="home">${BACK("Übersicht")}</button></header>
      <h2 class="title md">Alles an <em>einem Ort.</em></h2>
      <div class="settings-list">
      <section class="panel"><h2>Speicherort</h2><p id="storage-info">Deine Daten liegen ${where}</p></section>
      <section class="panel"><h2>Als App installieren</h2>
        <div class="howto"><span class="num c4">1</span><p><strong>iPhone:</strong> In Safari auf Teilen tippen, dann „Zum Home-Bildschirm“.</p>
        <span class="num c0">2</span><p><strong>Android:</strong> In Chrome im Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“.</p></div>
        <p class="hint">Danach öffnet sich Speicherpunkt wie eine normale App und funktioniert auch ohne Internet.</p></section>
      <section class="panel"><h2>Sicherung</h2>
        <p>Kopiert alle Projekte als Text. Leg ihn irgendwo ab, etwa in einer Notiz, und füge ihn auf einem anderen Gerät wieder ein.</p>
        <div class="row"><button data-action="export">Sicherung kopieren</button></div>
        <textarea id="f-export" readonly hidden aria-label="Sicherung als Text"></textarea>
      </section>
      <form class="panel" data-form="import"><h2>Sicherung einfügen</h2>
        <div class="field"><label for="f-import">Sicherungstext</label>
        <textarea id="f-import" name="data" placeholder="Hier den kopierten Text einfügen"></textarea></div>
        <div class="error" id="imp-err" ${view.err ? "" : "hidden"}>${esc(view.err || "")}</div>
        ${view.importConfirm ? `<p id="imp-confirm">Das ersetzt deine ${state.projects.length} Projekte durch die Sicherung. Fortfahren?</p>
        <div class="row"><button class="primary" type="submit">Ja, ersetzen</button><button type="button" data-action="imp-no">Abbrechen</button></div>`
        : `<div class="row"><button type="submit">Einfügen und ersetzen</button></div>`}
      </form>
      <section class="panel"><h2>Alles löschen</h2>
        ${confirmFor === "wipe" ? `<p>Wirklich alle Projekte löschen? Das lässt sich nicht rückgängig machen.</p>
          <div class="row"><button class="primary" data-action="wipe-yes">Ja, alles löschen</button><button data-action="wipe-no">Abbrechen</button></div>`
        : `<div class="row"><button data-action="wipe">Alle Projekte löschen</button></div>`}
      </section></div>`;
    }
  };

  function projRow(p) {
    const c = current(p), col = colorOf(p);
    if (p.finished) {
      return `<button class="proj finished ${col}" data-action="open" data-id="${esc(p.id)}">
      <span class="num" aria-hidden="true">✓</span>
      <span class="body"><span class="name">${esc(p.name)}</span>
      <span class="small">Abgeschlossen am ${esc(fmtDay.format(p.finished))} · ${p.saves.length} ${p.saves.length === 1 ? "Speicherpunkt" : "Speicherpunkte"}</span></span>
      <span class="go" aria-hidden="true">→</span></button>`;
    }
    return `<button class="proj ${col}${p.paused ? " resting" : ""}" data-action="open" data-id="${esc(p.id)}">
      <span class="num" aria-hidden="true">${esc(initial(p))}</span>
      <span class="body"><span class="name">${esc(p.name)}${isDue(p) ? ` <span class="tag">Erinnerung</span>` : ""}</span>
      <span class="step">${esc(c ? c.next : "Noch kein Schritt")}</span>
      <span class="small">${esc(ago(lastTouched(p)))} · ${p.saves.length} ${p.saves.length === 1 ? "Speicherpunkt" : "Speicherpunkte"}</span></span>
      <span class="go" aria-hidden="true">→</span></button>`;
  }

  function menuHtml(p) {
    if (confirmFor === "del:" + p.id) {
      return `<section class="panel confirm"><p>Projekt „${esc(p.name)}“ mit allen Speicherpunkten löschen?</p>
        <div class="row"><button class="primary" data-action="del-yes" data-id="${esc(p.id)}">Ja, löschen</button><button data-action="del-no">Abbrechen</button></div></section>`;
    }
    if (view.rename) {
      return `<form class="panel" data-form="rename"><div class="field"><label for="f-rename">Neuer Name</label>
        <input type="text" id="f-rename" name="name" value="${esc(p.name)}" maxlength="80" data-autofocus></div>
        <div class="row"><button class="primary" type="submit">Umbenennen</button><button type="button" data-action="menu-close">Abbrechen</button></div></form>`;
    }
    if (p.finished) {
      return `<section class="panel"><div class="row">
      <button data-action="reopen" data-id="${esc(p.id)}">Wieder öffnen</button>
      <button data-action="rename">Umbenennen</button>
      <button data-action="del" data-id="${esc(p.id)}">Löschen</button>
      <button class="ghost" data-action="menu-close">Schliessen</button></div></section>`;
    }
    return `<section class="panel"><div class="row">
      <button data-action="finish" data-id="${esc(p.id)}">Abschliessen</button>
      ${p.paused ? `<button data-action="resume" data-id="${esc(p.id)}">Aufwecken</button>` : `<button data-action="pause" data-id="${esc(p.id)}">Ruhen lassen</button>`}
      <button data-action="rename">Umbenennen</button>
      <button data-action="del" data-id="${esc(p.id)}">Löschen</button>
      <button class="ghost" data-action="menu-close">Schliessen</button></div>
      <p class="hint">Ruhen lassen heisst: kein Druck, keine Erinnerungen. Das Projekt wartet einfach. Abschliessen heisst: fertig, es braucht keinen nächsten Schritt mehr.</p></section>`;
  }

  // ---------- mutations ----------
  function commit() { if (!showingExamplesOnly()) persist(); }
  function showingExamplesOnly() { return state.projects.length === 0; }

  function readSaveForm(form) {
    return {
      name: form.querySelector("#f-name") ? form.querySelector("#f-name").value.trim() : "",
      where: form.querySelector("#f-where").value.trim(),
      next: form.querySelector("#f-next").value.trim(),
      remind: (view.draft && view.draft.remind) || "none"
    };
  }

  function handleSave(form) {
    const d = readSaveForm(form);
    view.draft = d;
    if (view.isNew && !d.name) { view.err = ""; return fieldError("f-name", "Gib dem Projekt einen Namen."); }
    if (!d.next) return fieldError("f-next", "Schreib einen kleinen nächsten Schritt auf, damit du später leicht wieder einsteigst.");
    const save = { id: uid(), at: now(), where: d.where, next: d.next };
    let p;
    if (view.isNew) {
      p = { id: uid(), name: d.name, created: now(), paused: false, remindAt: remindFrom(d.remind), saves: [save] };
      state.projects.push(p);
      persist();
      view = { name: "home" }; render();
      toast("Projekt angelegt. Dein Speicherpunkt ist gesichert.");
      return;
    }
    p = find(view.id);
    if (view.afterDone) { const c = current(p); if (c) c.done = true; }
    p.saves.push(save);
    p.remindAt = remindFrom(d.remind);
    p.paused = false;
    p.finished = null;
    commit();
    view = { name: "home" }; render();
    toast(p.example ? "Gespeichert (Beispiel, wird nicht dauerhaft gesichert)." : "Gespeichert. Hier geht es weiter, wann immer du bereit bist.");
  }

  function fieldError(id, msg) {
    const err = $app.querySelector("#err");
    if (id === "f-name") {
      let e = $app.querySelector("#name-err");
      if (!e) { e = document.createElement("div"); e.className = "error"; e.id = "name-err"; $app.querySelector("#f-name").after(e); }
      e.textContent = msg;
    } else if (err) { err.textContent = msg; err.hidden = false; }
    const el = $app.querySelector("#" + id); if (el) { el.setAttribute("aria-invalid", "true"); el.focus(); }
  }

  // ---------- events ----------
  $app.addEventListener("click", e => {
    const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
    const a = b.dataset.action, id = b.dataset.id;
    switch (a) {
      case "home": view = { name: "home" }; confirmFor = null; render(); window.scrollTo(0, 0); break;
      case "settings": view = { name: "settings" }; confirmFor = null; render(); window.scrollTo(0, 0); break;
      case "open": view = { name: "project", id }; confirmFor = null; render(); window.scrollTo(0, 0); break;
      case "new": view = { name: "save", isNew: true, draft: { remind: "3" } }; render(); window.scrollTo(0, 0); break;
      case "save": { const p = find(id), c = p && current(p); view = { name: "save", id, draft: { remind: "3", next: c && !c.done ? c.next : "" } }; render(); window.scrollTo(0, 0); break; }
      case "start": { const p = find(id); if (p) { p.remindAt = null; commit(); } view = { name: "focus", id, since: now() }; render(); window.scrollTo(0, 0); break; }
      case "done": view = { name: "save", id, afterDone: true, draft: { remind: "none" } }; render(); window.scrollTo(0, 0); break;
      case "edit": view.edit = true; render(); break;
      case "cancel-edit": view.edit = false; render(); break;
      case "snooze": { const p = find(id); if (p) { p.remindAt = startOfDay(now()) + DAY + 8 * 3600000; commit(); render(); toast("Alles klar, morgen wieder."); } break; }
      case "menu": view.menu = !view.menu; view.rename = false; confirmFor = null; render(); break;
      case "menu-close": view.menu = false; view.rename = false; confirmFor = null; render(); break;
      case "pause": { const p = find(id); p.paused = true; p.remindAt = null; commit(); view.menu = false; render(); toast("Das Projekt ruht. Es wartet einfach auf dich."); break; }
      case "resume": { const p = find(id); p.paused = false; commit(); view.menu = false; render(); toast("Willkommen zurück."); break; }
      case "rename": view.rename = true; render(); break;
      case "finish": {
        const p = find(id); if (!p) break;
        const form = b.closest("form");
        if (form && view.afterDone) {
          const where = form.querySelector("#f-where").value.trim();
          const c = current(p); if (c) c.done = true;
          if (where) p.saves.push({ id: uid(), at: now(), where, next: "Abgeschlossen", done: true, final: true });
        }
        p.finished = now(); p.paused = false; p.remindAt = null;
        commit(); view = { name: "project", id }; render(); window.scrollTo(0, 0);
        toast("Abgeschlossen. Gut gemacht.");
        break;
      }
      case "reopen": {
        const p = find(id); if (!p) break;
        view = { name: "save", id, reopen: true, draft: { remind: "none", next: "" } }; render(); window.scrollTo(0, 0);
        break;
      }
      case "del": confirmFor = "del:" + id; render(); break;
      case "del-no": confirmFor = null; render(); break;
      case "del-yes": {
        if (find(id) && find(id).example) { examples = examples.filter(p => p.id !== id); }
        else { state.projects = state.projects.filter(p => p.id !== id); persist(); }
        confirmFor = null; view = { name: "home" }; render(); toast("Projekt gelöscht."); break;
      }
      case "remind": {
        const form = b.closest("form"); if (form) view.draft = Object.assign(readSaveForm(form), { remind: b.dataset.k });
        form.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
        break;
      }
      case "export": {
        const txt = JSON.stringify(state);
        const ta = $app.querySelector("#f-export");
        const done = () => toast("Sicherung kopiert.");
        const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast("Text markiert. Kopiere ihn von Hand."); };
        try { navigator.clipboard.writeText(txt).then(done, fallback); } catch { fallback(); }
        break;
      }
      case "wipe": confirmFor = "wipe"; render(); break;
      case "imp-no": { view = { name: "settings" }; render(); break; }
      case "wipe-no": confirmFor = null; render(); break;
      case "wipe-yes": state = { v: 1, projects: [], updated: 0 }; examples = makeExamples(); persist(); confirmFor = null; view = { name: "home" }; render(); toast("Alles gelöscht."); break;
    }
  });

  $app.addEventListener("submit", e => {
    e.preventDefault();
    const form = e.target, kind = form.dataset.form;
    if (kind === "save") handleSave(form);
    else if (kind === "edit-step") {
      const p = find(view.id), v = form.querySelector("#f-step").value.trim();
      if (!v) return;
      current(p).next = v; commit(); view.edit = false; render(); toast("Schritt angepasst.");
    } else if (kind === "rename") {
      const p = find(view.id), v = form.querySelector("#f-rename").value.trim();
      if (!v) return;
      p.name = v; commit(); view.menu = false; view.rename = false; render(); toast("Umbenannt.");
    } else if (kind === "import") {
      const raw = form.querySelector("#f-import").value.trim();
      let s = null; try { s = JSON.parse(raw); } catch {}
      if (!valid(s)) { view = { name: "settings", err: "Das sieht nicht nach einer Sicherung aus. Füge den ganzen kopierten Text ein." }; render(); return; }
      if (state.projects.length && !view.importConfirm) { view = { name: "settings", importConfirm: true, pending: raw }; render(); $app.querySelector("#f-import").value = raw; return; }
      state = { v: 1, projects: s.projects, updated: 0 }; persist(); view = { name: "home" }; render(); toast("Sicherung eingefügt.");
    }
  });

  $app.addEventListener("input", e => {
    if (e.target.matches("[aria-invalid]")) e.target.removeAttribute("aria-invalid");
  });

  // live minute counter in focus view
  setInterval(() => {
    if (view.name === "focus") { const el = $app.querySelector("#since"); if (el) el.textContent = mins(view.since); }
  }, 15000);

  // ---------- boot ----------
  const local = readLocal();
  if (local) { state = local; storage = "local"; }
  render();
  // installierbare App: Offline-Cache und dauerhafter Speicher
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
  // Mehrere Tabs: Änderungen aus einem anderen Tab übernehmen
  window.addEventListener("storage", e => { if (e.key === KEY) { const s = readLocal(); if (s) { state = s; render(); } } });
})();
</script>
</body>
</html>
